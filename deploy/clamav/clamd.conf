Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
TCPSocket 3310
TCPAddr ::
LocalSocket /tmp/clamd.sock
FixStaleSocket yes
LogTime yes
LogClean no
LogVerbose no
StreamMaxLength 110M
MaxFileSize 110M
MaxScanSize 300M
AlertExceedsMax yes
MaxRecursion 16
MaxFiles 10000
MaxThreads 2
MaxQueue 10
ReadTimeout 120
CommandReadTimeout 30
SendBufTimeout 120
SelfCheck 3600
ConcurrentDatabaseReload no
