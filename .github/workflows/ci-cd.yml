name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pronatec_test
          POSTGRES_PASSWORD: test-only-local
          POSTGRES_DB: pronatec_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://pronatec_test:test-only-local@127.0.0.1/pronatec_test
      TEST_S3_ENDPOINT: http://127.0.0.1:9000
      TEST_CLAMD_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Prepare isolated storage and scanner
        run: |
          python -m pip install 'moto[server]>=5.0,<6'
          python -m moto.server -H 127.0.0.1 -p 9000 > /tmp/pronatec-storage.log 2>&1 &
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y clamav-daemon
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          printf '%s\n' 'DatabaseDirectory /var/lib/clamav' 'TCPSocket 3310' 'TCPAddr 127.0.0.1' 'Foreground yes' 'StreamMaxLength 110M' 'MaxFileSize 110M' 'MaxScanSize 300M' 'MaxRecursion 16' 'User clamav' > /tmp/pronatec-clamd.conf
          sudo clamd --config-file=/tmp/pronatec-clamd.conf > /tmp/pronatec-scanner.log 2>&1 &
          python - <<'PY'
          import socket, time
          for port in [9000, 3310]:
              for attempt in range(120):
                  try:
                      with socket.create_connection(('127.0.0.1', port), timeout=1):
                          break
                  except OSError:
                      time.sleep(1)
              else:
                  raise RuntimeError(f'Test service on {port} unavailable')
          PY
      - run: npm run test:integration
      - name: Build application image
        run: docker build -t pronatec-hosted:test .
