name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pronatec_test
          POSTGRES_PASSWORD: test-only-local
          POSTGRES_DB: pronatec_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://pronatec_test:test-only-local@127.0.0.1/pronatec_test
      TEST_S3_ENDPOINT: http://127.0.0.1:9000
      TEST_CLAMD_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Start S3-compatible storage (moto)
        run: |
          python3 -m venv /tmp/moto-venv
          /tmp/moto-venv/bin/pip install --quiet 'moto[server]>=5.0,<6'
          nohup /tmp/moto-venv/bin/python -m moto.server -H 127.0.0.1 -p 9000 > /tmp/pronatec-storage.log 2>&1 &
      - name: Install ClamAV
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y clamav-daemon clamav-freshclam
          sudo systemctl stop clamav-daemon clamav-freshclam || true
      - name: Download ClamAV signatures
        run: |
          for attempt in 1 2 3 4; do
            sudo freshclam && exit 0
            echo "freshclam attempt $attempt failed; retrying"
            sleep 20
          done
          exit 1
      - name: Start ClamAV daemon
        run: |
          printf '%s\n' 'DatabaseDirectory /var/lib/clamav' 'TCPSocket 3310' 'TCPAddr 127.0.0.1' 'Foreground yes' 'StreamMaxLength 110M' 'MaxFileSize 110M' 'MaxScanSize 300M' 'MaxRecursion 16' 'User clamav' > /tmp/pronatec-clamd.conf
          sudo nohup clamd --config-file=/tmp/pronatec-clamd.conf > /tmp/pronatec-scanner.log 2>&1 &
      - name: Wait for storage and scanner
        run: |
          python - <<'PY'
          import pathlib, socket, subprocess, sys, time

          SERVICES = {9000: '/tmp/pronatec-storage.log', 3310: '/tmp/pronatec-scanner.log'}

          def reachable(port):
              try:
                  with socket.create_connection(('127.0.0.1', port), timeout=1):
                      return True
              except OSError:
                  return False

          def annotate(title, text):
              body = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title={title}::{body}')

          failed = []
          for port, log in SERVICES.items():
              deadline = time.monotonic() + 180
              while not reachable(port) and time.monotonic() < deadline:
                  time.sleep(1)
              if reachable(port):
                  continue
              failed.append(port)
              path = pathlib.Path(log)
              tail = path.read_text(errors='replace')[-1500:] if path.exists() else '(no log)'
              sockets = subprocess.run(['ss', '-ltn'], capture_output=True, text=True).stdout
              procs = subprocess.run(['pgrep', '-af', 'clamd|moto'], capture_output=True, text=True).stdout
              annotate(f'Port {port} unavailable', f'{tail}\n--- listening ---\n{sockets}\n--- processes ---\n{procs}')
          sys.exit(1 if failed else 0)
          PY
      - name: Integration tests
        run: |
          set +e
          npm run test:integration 2>&1 | tee /tmp/integration.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          import re
          text = open('/tmp/integration.log', errors='replace').read()
          failing = [l for l in text.splitlines() if re.search(r'✖|not ok|Error|ECONN|ENOT|denied|failed', l)][:25]
          def annotate(title, body):
              body = body.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::error title={title}::{body}')
          annotate('Integration failures', '\n'.join(failing) or '(no matching lines)')
          annotate('Integration output tail', text[-2500:])
          PY
          fi
          exit $status
      - name: Build application image
        run: docker build -t pronatec-hosted:test .
